spring.application.name=gestion-backend

# Conexion a MySQL: los valores reales se definen fuera del codigo,
# como variables de entorno (ver backend/README.md).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rojasfc}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo administra database/schema.sql (incluye triggers, checks y
# columnas generadas que Hibernate no puede inferir ni generar).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=${SERVER_PORT:8080}

# JWT (arquitectura-inicial.md, seccion 8). JWT_SECRET es obligatoria y debe
# tener al menos 32 caracteres; nunca se escribe en el codigo.
app.jwt.secret=${JWT_SECRET}
app.jwt.duracion-minutos=${JWT_DURACION_MINUTOS:480}

# Primer administrador (solo se usa si la tabla administrador esta vacia).
app.admin-inicial.dni=${ADMIN_INICIAL_DNI:}
app.admin-inicial.nombre=${ADMIN_INICIAL_NOMBRE:}
app.admin-inicial.apellido=${ADMIN_INICIAL_APELLIDO:}
app.admin-inicial.email=${ADMIN_INICIAL_EMAIL:}
app.admin-inicial.contrasena=${ADMIN_INICIAL_CONTRASENA:}

# El ingreso se resuelve con JWT (security/); se desactiva el usuario en
# memoria que Spring Security crea por defecto.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Mensajes de validacion en castellano, porque el frontend los muestra tal cual.
spring.web.locale=es
spring.web.locale-resolver=fixed
