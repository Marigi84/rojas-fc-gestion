spring.application.name=gestion-backend

# Conexion a MySQL: los valores reales se definen fuera del codigo,
# como variables de entorno (ver backend/README.md).
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rojasfc}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo administra database/schema.sql (incluye triggers, checks y
# columnas generadas que Hibernate no puede inferir ni generar).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server.port=${SERVER_PORT:8080}

# Zona horaria de la escuela, para fechar altas y bajas (config/RelojConfig).
app.zona-horaria=${ZONA_HORARIA:America/Argentina/Cordoba}

# JWT (arquitectura-inicial.md, seccion 8). JWT_SECRET es obligatoria y debe
# tener al menos 32 caracteres; nunca se escribe en el codigo.
app.jwt.secret=${JWT_SECRET}
app.jwt.duracion-minutos=${JWT_DURACION_MINUTOS:480}

# Recuperacion de la contrasena del Administrador por correo (RF-50). El enlace
# vence a los 30 minutos y lleva a la pantalla del frontend que indica
# FRONTEND_URL.
app.recuperacion.duracion-minutos=${RECUPERACION_DURACION_MINUTOS:30}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Envio de correos por SMTP. Por defecto, Gmail con una contrasena de
# aplicacion: MAIL_USERNAME es la cuenta y MAIL_PASSWORD la contrasena de
# aplicacion, siempre como variables de entorno (ver backend/README.md).
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
app.correo.remitente=${MAIL_FROM:${MAIL_USERNAME:}}


# El ingreso se resuelve con JWT (security/); se desactiva el usuario en
# memoria que Spring Security crea por defecto.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Mensajes de validacion en castellano, porque el frontend los muestra tal cual.
spring.web.locale=es
spring.web.locale-resolver=fixed
